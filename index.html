<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="index, follow" />

  <!-- Runtime language detection. Runs synchronously before the app module
       loads so the first paint is already in the visitor's language
       (defaults to English). SEO meta/structured data below stays English. -->
  <script>
    (function () {
      var l = (navigator.language || "en").toLowerCase().startsWith("tr")
        ? "tr"
        : "en";
      window.__APP_LANG__ = l;
      document.documentElement.lang = l;
    })();
  </script>
  <meta name="author" content="Utku Ceylan" />
  <meta name="theme-color" content="#000000" />

  <!-- Critical background: dark base before JS/styles load (avoids white flash on slow/mobile connections) -->
  <style>
    html {
      background-color: #050508;
    }
  </style>

  <!-- LCP image: desktop background (themes.ts kali.backgroundImage) -->
  <link rel="preload" as="image" href="/kali-net.webp" />

  <!-- Primary Meta Tags -->
  <title>Lunixizm's Portfolio</title>
  <meta name="title" content="Lunixizm (Utku Ceylan) - Security Researcher" />
  <meta name="description"
    content="Security researcher specializing in application security, vulnerability research." />
  <meta name="keywords"
    content="security researcher, application security, vulnerability research, CVE writeups" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://lunixizm.website/" />
  <meta property="og:site_name" content="Lunixizm" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:title" content="Lunixizm (Utku Ceylan) - Security Researcher" />
  <meta property="og:description"
    content="Security researcher specializing in application security, vulnerability research." />
  <meta property="og:image" content="https://lunixizm.website/kali-net.webp" />
  <meta property="og:image:alt" content="Lunixizm security researcher portfolio" />

  <!-- Favicons and assets -->
  <link rel="icon" type="image/png" href="/favicon.webp" />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&display=swap" as="style"
    onload="this.onload=null;this.rel='stylesheet'" />

  <!-- Structured Data: Person -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Lunixizm",
      "jobTitle": "Security Researcher",
      "url": "https://lunixizm.website/",
      "image": "https://lunixizm.website/favicon.webp",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Istanbul",
        "addressCountry": "Turkey"
      },
      "knowsAbout": [
        "Application Security",
        "Linux Systems",
        "Vulnerability Research",
        "Web Application Security",
        "Cloud Security",
        "Coordinated Vulnerability Disclosure",
        "Software Engineering",
        "Capture The Flag (CTF)",
        "Vulnerability Assessment"
      ],
      "sameAs": [
        "https://github.com/Lunixizm0",
        "https://www.linkedin.com/in/utku-ceylan-/"
      ]
    }
  </script>

  <!-- Structured Data: WebSite -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Lunixizm's Portfolio",
      "url": "https://lunixizm.website/",
      "inLanguage": "en",
      "description": "Security researcher specializing in linux systems, vulnerability research.",
      "publisher": {
        "@type": "Person",
        "name": "Lunixizm"
      }
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
