<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/favicon.webp" type="image/webp">

  <title>Social</title>
  <meta name="description" content="Utku Ceylan — Okul saatlerim. Bu sayfa canlıdır: şu an müsait miyim, ne kadar süre müsaitim onu gösterir.">
  <meta name="author" content="Utku Ceylan">
  <meta name="theme-color" content="#0a0a0a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      overflow-x: hidden;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0a0a0a;
      color: #ffffff;
      min-height: 100vh;
      min-height: 100dvh;
    }

    :root {
      --color-bg: #0a0a0a;
      --color-text: #ffffff;
      --color-accent: #ff453a;
      --color-surface: #151515;
      --color-neutral-200: rgba(255, 255, 255, .07);
      --color-neutral-300: rgba(255, 255, 255, .08);
      --color-neutral-600: rgba(255, 255, 255, .45);
      --color-neutral-700: rgba(255, 255, 255, .6);
      --color-accent-100: rgba(255, 69, 58, .14);
      --color-accent-700: #ff9d92;
      --color-accent-800: #ff453a;
      --radius-md: 9px;
      --font-heading: "Inter", system-ui, sans-serif;
      --font-body: "Inter", system-ui, sans-serif;
    }

    /* ── Video arka plan (video yoksa gradient) ── */
    .video-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      overflow: hidden;
      background:
        radial-gradient(120% 90% at 20% 10%, #1c2434 0%, #101420 40%, #0a0a0a 75%);
    }

    .video-container::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(10, 10, 10, 0.3) 0%,
        rgba(10, 10, 10, 0.6) 50%,
        rgba(10, 10, 10, 0.9) 100%
      );
      pointer-events: none;
    }

    #bgPlayerWrap {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 177.78vh;
      min-width: 100vw;
      height: 56.25vw;
      min-height: 100vh;
      overflow: hidden;
    }

    #bgPlayerWrap iframe {
      width: 100% !important;
      height: 100% !important;
      border: 0;
      pointer-events: none !important;
    }

    /* Video modunda ekrana gelen tıklamaları YouTube iframe'ine ulaştırmadan yutar */
    #videoClickCatcher {
      display: none;
    }

    body.video-only #videoClickCatcher {
      display: block;
      position: fixed;
      inset: 0;
      z-index: 50;
      cursor: default;
    }

    /* ── Ana kapsayıcı ── */
    .main-wrapper {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(16px, 4vw, 28px) clamp(12px, 3.5vw, 20px) calc(84px + env(safe-area-inset-bottom, 0px));
      position: relative;
      z-index: 1;
    }

    .kartlar {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-wrap: wrap;
      gap: clamp(14px, 3vw, 20px);
      align-items: stretch;
      justify-content: center;
    }

    .cam-kart {
      flex: 1 1 340px;
      max-width: 430px;
      min-width: 0;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: clamp(18px, 5vw, 24px);
      display: flex;
      flex-direction: column;
    }

    .profile-card {
      padding: clamp(22px, 5.5vw, 32px) clamp(16px, 4.5vw, 24px);
      animation: fadeInUp 0.8s ease-out;
    }

    .musaitlik-card {
      padding: clamp(20px, 5vw, 28px) clamp(16px, 4.5vw, 24px);
      animation: fadeInUp 0.8s ease-out 0.1s backwards;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes bkNabiz {
      0%, 100% { box-shadow: 0 0 0 0 currentColor; opacity: 1; }
      50% { box-shadow: 0 0 0 7px transparent; opacity: .55; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }

    /* ── Sol kart: profil ── */
    .profile-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .profile-name {
      font-size: clamp(23px, 6.5vw, 28px);
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 0%, #a0a0a0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .profile-bio {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      font-weight: 400;
    }

    .widgets-section {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 28px;
      flex: 1;
      justify-content: center;
    }

    .widget-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 12px;
      transition: all 0.3s ease;
      overflow: hidden;
    }

    .widget-card:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: rgba(255, 255, 255, 0.12);
      transform: translateY(-2px);
    }

    /* ── GitHub istatistik widget'ı ── */
    .github-widget-card {
      padding: clamp(18px, 4.5vw, 26px);
    }

    .github-widget {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .gw-yukleniyor {
      font-size: 13px;
      color: rgba(255, 255, 255, .45);
      text-align: center;
      padding: 20px 0;
    }

    .gw-ust-baslik {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .gw-logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .02em;
      color: rgba(255, 255, 255, .85);
    }

    .gw-gor {
      margin-left: auto;
      font-size: 12px;
      font-weight: 600;
      color: rgba(255, 255, 255, .5);
      text-decoration: none;
      transition: color .2s ease;
    }

    .gw-gor:hover { color: #fff; }

    .gw-ust {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .gw-avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .12);
      flex: none;
    }

    .gw-bilgi {
      flex: 1;
      min-width: 0;
    }

    .gw-isim {
      font-size: 24px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gw-kullanici {
      font-size: 15px;
      color: rgba(255, 255, 255, .5);
      text-decoration: none;
    }

    .gw-kullanici:hover { color: #fff; }

    .gw-biyo {
      display: block;
      font-size: 14px;
      color: rgba(255, 255, 255, .62);
      line-height: 1.45;
      margin-top: 6px;
    }

    .gw-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      text-align: center;
    }

    .gw-stat {
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .07);
      border-radius: 14px;
      padding: 14px 4px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .gw-sayi {
      font-size: 26px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
    }

    .gw-etiket {
      font-size: 11px;
      color: rgba(255, 255, 255, .45);
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .gw-dil-cubuk {
      display: flex;
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(255, 255, 255, .06);
    }

    .gw-dil-cubuk i { height: 100%; }

    .gw-dil-lejant {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      font-size: 12px;
      font-weight: 600;
    }

    .gw-alt-baslik {
      font-size: 11px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .4);
    }

    .gw-aktif {
      display: grid;
      gap: 9px;
    }

    .gw-aktif-satir {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 13px;
      line-height: 1.4;
    }

    .gw-aktif-nokta {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #1ed760;
      flex: none;
    }

    .gw-aktif-metin {
      flex: 1;
      min-width: 0;
      color: rgba(255, 255, 255, .75);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .gw-aktif-zaman {
      color: rgba(255, 255, 255, .35);
      white-space: nowrap;
      font-size: 12px;
    }

    .github-widget--hata p {
      font-size: 13px;
      color: rgba(255, 255, 255, .6);
    }

    .gw-link {
      display: inline-block;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #fff;
      background: rgba(255, 255, 255, .08);
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 10px;
      padding: 8px 14px;
      text-decoration: none;
      transition: all .2s ease;
    }

    .gw-link:hover { background: rgba(255, 255, 255, .14); }

    /* ── Sosyal linkler ── */
    .social-section {
      margin-bottom: 24px;
    }

    .social-grid {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .social-link {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      flex: none;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      color: rgba(255, 255, 255, 0.8);
      text-decoration: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .social-link:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      transform: translateY(-4px) scale(1.05);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
    }

    .social-link svg {
      width: 18px;
      height: 18px;
    }

    .social-link.github:hover {
      background: rgba(255, 255, 255, 0.15);
      border-color: rgba(255, 255, 255, 0.3);
    }

    .social-link.email:hover {
      background: rgba(234, 67, 53, 0.12);
      border-color: rgba(234, 67, 53, 0.35);
      color: #ea4335;
    }

    .social-link.linkedin:hover {
      background: rgba(10, 102, 194, 0.15);
      border-color: rgba(10, 102, 194, 0.45);
      color: #5bb0ef;
    }

    /* ─────────── Sağ kart: müsaitlik ─────────── */

    .durum-satir {
      display: flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 14px;
    }

    .durum-nokta {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      background: #1ed760;
      color: #1ed760;
      animation: bkNabiz 2.4s ease-out infinite;
      flex: none;
    }

    .kart-etiket {
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .45);
    }

    .durum-satir .kart-etiket { flex: 1; }

    .durum-tarih {
      font-size: 11px;
      color: rgba(255, 255, 255, .3);
    }

    .durum-metni {
      font-size: clamp(21px, 6vw, 26px);
      font-weight: 700;
      letter-spacing: -.02em;
      line-height: 1.12;
      text-wrap: balance;
      color: #1ed760;
    }

    .geri-sayim {
      font-size: clamp(14px, 4vw, 16px);
      font-weight: 600;
      margin-top: 8px;
      font-variant-numeric: tabular-nums;
      color: rgba(255, 255, 255, .92);
      min-height: 19px;
    }

    .alt-metin {
      font-size: 13px;
      color: rgba(255, 255, 255, .5);
      margin-top: 3px;
    }

    .ic-kart {
      background: rgba(255, 255, 255, .04);
      border: 1px solid rgba(255, 255, 255, .06);
      border-radius: 16px;
      padding: 14px;
      margin-top: 14px;
    }

    .ic-kart--takvim { margin-top: 18px; }

    .ay-satir {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .ay-adi {
      flex: 1;
      font-size: 14px;
      font-weight: 600;
    }

    .ay-dugme {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .1);
      background: rgba(255, 255, 255, .06);
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      font-family: inherit;
    }

    .ay-dugme:hover { background: rgba(255, 255, 255, .14); }

    .ay-dugme--bugun {
      width: auto;
      height: 28px;
      padding: 0 11px;
      border-radius: 999px;
      font-size: 11px;
    }

    .izgara {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .bk-gun-basligi {
      text-align: center;
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(255, 255, 255, .3);
      padding-bottom: 3px;
    }

    .bk-hucre:not(.bk-hucre--bos):hover { transform: scale(1.06); }
    .bk-hucre--bos { pointer-events: none; visibility: hidden; }

    .bk-hucre {
      aspect-ratio: 1;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(255, 255, 255, .05);
      color: rgba(255, 255, 255, .75);
      border: 1px solid rgba(255, 255, 255, .06);
      transition: transform .15s ease, background .2s ease, border-color .2s ease;
    }

    .bk-hucre--musait {
      background: rgba(255, 255, 255, .04);
      color: rgba(255, 255, 255, .55);
    }

    .bk-hucre--calisma {
      background: rgba(255, 59, 48, .22);
      border-color: rgba(255, 59, 48, .3);
      color: #ff9d92;
    }

    .bk-hucre--tatil {
      background: rgba(255, 255, 255, .06);
      color: rgba(255, 255, 255, .35);
      border: 1px dashed rgba(255, 255, 255, .18);
    }

    .bk-hucre--bugun { box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .5); }

    .bk-hucre--secili { outline: 2px solid #fff; outline-offset: 1px; z-index: 1; }

    /* Gün çizelgesi şeridi */
    .bk-cizelge-strip {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: 42px;
      gap: 4px;
      overflow-x: auto;
      padding: 2px 2px 8px;
      margin-top: 12px;
      scrollbar-width: thin;
    }

    .bk-dilim {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 3px;
    }

    .bk-dilim .bk-saat {
      font-size: 9px;
      color: rgba(255, 255, 255, .35);
      height: 11px;
      line-height: 11px;
      white-space: nowrap;
    }

    .bk-dilim .bk-bar {
      width: 100%;
      height: 26px;
      border-radius: 6px;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .06);
      transition: background .2s ease;
    }

    .bk-dilim--dolu .bk-bar {
      background: rgba(255, 59, 48, .32);
      border-color: rgba(255, 59, 48, .38);
    }

    .bk-dilim--dolu:hover .bk-bar { background: rgba(255, 59, 48, .48); }

    .lejant {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 12px;
      font-size: 10px;
      color: rgba(255, 255, 255, .45);
    }

    .lejant span {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .lejant i {
      width: 9px;
      height: 9px;
      border-radius: 3px;
      display: inline-block;
    }

    .cizelge-baslik {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .cizelge-baslik .kart-etiket {
      flex: 1;
      font-size: 10px;
      color: rgba(255, 255, 255, .35);
    }

    .secili-durum {
      font-size: 12px;
      font-weight: 600;
    }

    .secili-tarih {
      font-size: 15px;
      font-weight: 600;
      margin-top: 3px;
    }

    .bk-blok-saat {
      font-size: 11px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .bk-blok-etiket {
      font-size: 11px;
      opacity: .75;
      white-space: nowrap;
    }

    .cizelge-bos {
      font-size: 12px;
      color: #1ed760;
      margin-top: 10px;
    }

    .blok-listesi {
      display: grid;
      gap: 5px;
      margin-top: 12px;
    }

    .blok-satir {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 11px;
      line-height: 1.35;
    }

    .blok-nokta {
      width: 8px;
      height: 8px;
      border-radius: 3px;
      flex: none;
      display: inline-block;
      margin-top: 3px;
    }

    .blok-govde {
      flex: 1;
      min-width: 0;
    }

    .blok-ust {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .blok-saat {
      font-weight: 600;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }

    .blok-etiket {
      color: rgba(255, 255, 255, .62);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .blok-kaynak {
      color: rgba(255, 255, 255, .3);
      white-space: nowrap;
    }

    .blok-not {
      font-size: 11px;
      color: rgba(255, 255, 255, .58);
      margin-top: 2px;
      line-height: 1.4;
    }

    .gun-notlari {
      display: grid;
      gap: 6px;
      margin-top: 12px;
    }

    .gun-notu {
      font-size: 12px;
      line-height: 1.45;
      color: rgba(255, 255, 255, .62);
      padding: 8px 11px;
      border-radius: 10px;
      background: rgba(255, 255, 255, .04);
      border-left: 2px solid rgba(255, 255, 255, .18);
    }

    .kart-alt {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: auto;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, .06);
    }

    .kart-alt .tz-not {
      font-size: 11px;
      color: rgba(255, 255, 255, .32);
      flex: 1;
    }

    .kart-alt a {
      font-size: 11px;
      color: rgba(255, 255, 255, .35);
      text-decoration: none;
    }

    .kart-alt a:hover { color: #fff; }

    .hata-metni {
      font-size: 12px;
      color: #ff8a80;
      margin: 8px 0 0;
    }

    @media (max-width: 480px) {
      .main-wrapper {
        align-items: flex-start;
        padding-top: 40px;
      }
    }

    /* ── Ses kontrolleri ── */
    .sound-controls {
      position: fixed;
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      right: clamp(12px, 4vw, 20px);
      display: flex;
      align-items: center;
      gap: clamp(8px, 2.5vw, 12px);
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 50px;
      padding: 7px clamp(11px, 3.5vw, 16px);
      z-index: 100;
      transition: all 0.3s ease;
    }

    .sound-controls:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .sound-btn {
      width: 36px;
      height: 36px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: white;
      transition: all 0.3s ease;
    }

    .sound-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.1);
    }

    .sound-btn svg {
      width: 18px;
      height: 18px;
    }

    .sound-btn.muted svg.unmuted,
    .sound-btn:not(.muted) svg.muted {
      display: none;
    }

    .sound-btn.muted svg.muted,
    .sound-btn:not(.muted) svg.unmuted {
      display: block;
    }

    .volume-slider {
      width: clamp(56px, 18vw, 80px);
      height: 4px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .volume-slider:hover { height: 6px; }

    .volume-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: #ffffff;
      border-radius: 50%;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .volume-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }

    .volume-slider::-moz-range-thumb {
      width: 14px;
      height: 14px;
      background: #ffffff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }

    .volume-percent {
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
      min-width: 32px;
      text-align: center;
      font-weight: 500;
    }

    /* ── Video modu (sadece video) ── */
    body.video-only .main-wrapper {
      display: none;
    }

    .video-mode-btn {

    @keyframes fadeInHint {

        <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>

  <script>
    // Arka plan videosu cihaza göre değişir:
    //   mobil  → Bad Apple!! PV (shadow art) — Rule 86: If it exists, it can play Bad Apple
    //   masaüstü → seçili YouTube videosu
    const IS_MOBIL = window.matchMedia('(max-width: 768px)').matches;
    const VIDEO_ID = IS_MOBIL ? 'FtutLA63Cp8' : '30jrmzzgHLc';
    document.title = IS_MOBIL ? 'Social / Rule 86: If it exists, it can play Bad Apple' : 'Social';

    const soundBtn = document.getElementById('soundBtn');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumePercent = document.getElementById('volumePercent');
    const videoModeBtn = document.getElementById('videoModeBtn');
    const soundControls = document.getElementById('soundControls');

    let isMuted = true;
    let currentVolume = 0.25;
    let player = null;
    let playerReady = false;

    function onYouTubeIframeAPIReady() {
      player = new YT.Player('bgPlayer', {
        videoId: VIDEO_ID,
        playerVars: {
          autoplay: 1,
          controls: 0,
          disablekb: 1,
          fs: 0,
          iv_load_policy: 3,
          modestbranding: 1,
          mute: 1,
          playsinline: 1,
          rel: 0
        },
        events: {
          onReady: onPlayerReady,
          onStateChange: onPlayerStateChange,
          onError: onPlayerError
        }
      });
    }

    function onPlayerReady() {
      playerReady = true;
      player.setVolume(Math.round(currentVolume * 100));
      player.mute();
      player.playVideo();
    }

    function onPlayerStateChange(e) {
      if (e.data === YT.PlayerState.ENDED) {
        player.seekTo(0, true);
        player.playVideo();
      }
    }

    function onPlayerError() {
      soundControls.style.display = 'none';
    }

    function toggleVideoMode() {
      const active = document.body.classList.toggle('video-only');
      videoModeBtn.classList.toggle('active', active);
      videoModeBtn.querySelector('.vmb-label').textContent = active ? 'Videoyu gizle' : 'Videoyu göster';
    }

    function enableSound() {
      if (!playerReady) return;
      isMuted = false;
      player.unMute();
      player.setVolume(Math.round(currentVolume * 100));
      player.playVideo();
      soundBtn.classList.remove('muted');
    }

    function toggleSound() {
      if (!playerReady) return;
      isMuted = !isMuted;
      if (isMuted) {
        player.mute();
        soundBtn.classList.add('muted');
      } else {
        player.unMute();
        player.setVolume(Math.round(currentVolume * 100));
        player.playVideo();
        soundBtn.classList.remove('muted');
      }
    }

    function changeVolume(value) {
      currentVolume = value / 100;
      if (playerReady) player.setVolume(Math.round(currentVolume * 100));
      volumePercent.textContent = value + '%';
      if (currentVolume > 0 && isMuted) {
        isMuted = false;
        if (playerReady) player.unMute();
        soundBtn.classList.remove('muted');
      }
      if (currentVolume === 0) {
        soundBtn.classList.add('muted');
      }
    }

    soundBtn.addEventListener('click', toggleSound);
    volumeSlider.addEventListener('input', () => changeVolume(volumeSlider.value));
    videoModeBtn.addEventListener('click', toggleVideoMode);

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.sound-controls')) enableSound();
    }, { once: true });

    // Müsaitlik motoru config.json'u buradan okur
    window.BK_CONFIG_YOLU = '/social/config.json';
  </script>
